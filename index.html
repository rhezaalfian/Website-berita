<!DOCTYPE html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="kabar — portal berita ringkas: feed, kuis, jajak pendapat, dan simpan baca-nanti.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230fa958'/><text x='50' y='73' font-size='66' text-anchor='middle' fill='white' font-family='Arial' font-weight='800'>k</text></svg>">
<title>kabar — portal berita</title>
<style>
  :root {
    --bg: #fbfbf9; --surface: #ffffff; --ink: #16181a; --ink-soft: #34383b; --muted: #6c7175;
    --line: #e7e7e1; --panel: #f2f2ee; --accent: #0fa958; --accent-dark: #0c9049; --accent-tint: #e7f7ee;
    --radius: 16px; --radius-sm: 12px; --maxw: 1180px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: var(--sans); /* tipografi kembali ke sans */
    --card-shadow: 0 6px 22px rgba(0,0,0,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111312; --surface:#191c1a; --ink:#eef0ec; --ink-soft:#cbcfc9; --muted:#8b918b;
      --line:#262a26; --panel:#1b1f1c; --accent:#22c06a; --accent-dark:#1aa85c; --accent-tint:#12241a; --card-shadow:0 6px 24px rgba(0,0,0,.5); }
  }
  :root[data-theme="dark"] { --bg:#111312; --surface:#191c1a; --ink:#eef0ec; --ink-soft:#cbcfc9; --muted:#8b918b;
      --line:#262a26; --panel:#1b1f1c; --accent:#22c06a; --accent-dark:#1aa85c; --accent-tint:#12241a; --card-shadow:0 6px 24px rgba(0,0,0,.5); }
  :root[data-theme="light"] { --bg:#fbfbf9; --surface:#ffffff; --ink:#16181a; --ink-soft:#34383b; --muted:#6c7175;
      --line:#e7e7e1; --panel:#f2f2ee; --accent:#0fa958; --accent-dark:#0c9049; --accent-tint:#e7f7ee; --card-shadow:0 6px 22px rgba(0,0,0,.09); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  ::selection { background: var(--accent); color: #fff; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }
  .serif { font-family: var(--serif); }
  .eyebrow { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }

  /* Penajaman tipografi sans (minimalis) */
  .brand, .foot .big { font-weight: 800; letter-spacing: -0.04em; }
  .hero-text h1, .article h1 { font-weight: 800; letter-spacing: -0.035em; line-height: 1.06; }
  .sec-head h2, .empty h3 { font-weight: 800; letter-spacing: -0.03em; }
  .ncard h3, .list-item h3, .pop .t, .rail-box h4, .nl h4 { font-weight: 700; letter-spacing: -0.02em; }

  /* Reading progress bar (artikel) */
  .progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 60; transition: width .1s linear; }

  /* Back to top */
  .totop { position: fixed; right: 20px; bottom: 20px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-size: 1.2rem; cursor: pointer; box-shadow: var(--card-shadow); z-index: 60;
    display: grid; place-items: center; opacity: 0; pointer-events: none; transform: translateY(12px); transition: opacity .22s, transform .22s; }
  .totop.show { opacity: 1; pointer-events: auto; transform: none; }
  .totop:hover { border-color: var(--accent); color: var(--accent-dark); }

  /* Feed list "Terbaru" (teks + thumbnail kecil) */
  .list-item { display: grid; grid-template-columns: 1fr 140px; gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--line);
    cursor: pointer; align-items: center; }
  .list-item:first-child { padding-top: 4px; }
  .li-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .li-sep { color: var(--muted); }
  .li-time { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .list-item .cat { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-dark);
    display: inline-flex; align-items: center; gap: 6px; }
  .list-item .cat .swatch { width: 7px; height: 7px; border-radius: 2px; }
  .list-item h3 { font-size: 1.2rem; line-height: 1.28; margin-bottom: 6px; }
  .list-item:hover h3 { color: var(--accent-dark); }
  .list-item p { color: var(--muted); font-size: .9rem; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list-item .src { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
  .list-item .src .srcname { color: var(--ink-soft); font-weight: 600; }
  .list-item .thumb { border-radius: var(--radius-sm); overflow: hidden; aspect-ratio: 4/3; background: var(--panel); }
  .list-item .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.22,.61,.36,1); }
  .list-item:hover .thumb img { transform: scale(1.05); }
  .avatar.sm { width: 22px; height: 22px; font-size: .6rem; }
  .dotsep { opacity: .6; }

  @keyframes viewIn { from { opacity: 0; transform: translateY(9px);} to { opacity: 1; transform: none; } }
  #view.in { animation: viewIn .4s cubic-bezier(.22,.61,.36,1); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto; } }

  .strip { border-bottom: 1px solid var(--line); font-size: .74rem; color: var(--muted); background: var(--surface); }
  .strip .wrap { display: flex; justify-content: space-between; align-items: center; height: 34px; }
  .strip .live { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--ink-soft); }
  .strip .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(15,169,88,.5);} 70%{box-shadow:0 0 0 7px rgba(15,169,88,0);} 100%{box-shadow:0 0 0 0 rgba(15,169,88,0);} }

  .nav { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.5) blur(14px); border-bottom: 1px solid var(--line); }
  .nav-inner { display: flex; align-items: center; gap: 18px; height: 62px; }
  .brand { font-family: var(--serif); font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; cursor: pointer; }
  .brand b { color: var(--accent); }
  .nav-cats { display: flex; gap: 2px; margin-left: 10px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav-cats::-webkit-scrollbar { display: none; }
  .nav-cats a { padding: 7px 13px; border-radius: 999px; font-size: .87rem; font-weight: 500; color: var(--ink-soft);
    white-space: nowrap; cursor: pointer; transition: background .16s, color .16s; }
  .nav-cats a:hover { background: var(--panel); color: var(--ink); }
  .nav-cats a.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer; font-size: .95rem; transition: background .16s; }
  .icon-btn:hover { background: var(--panel); }
  .search-inline { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 0 6px 0 14px; height: 37px; }
  .search-inline input { border: none; background: none; outline: none; color: var(--ink); font-size: .85rem; width: 140px; font-family: inherit; }
  .search-inline button { border: none; background: var(--accent); color: #fff; width: 27px; height: 27px; border-radius: 999px; cursor: pointer; font-size: .8rem; }

  main { padding: 30px 0 20px; }

  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
  .sec-head h2 { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }

  /* ===== Hero editorial ===== */
  .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center;
    padding-bottom: 32px; margin-bottom: 30px; border-bottom: 1px solid var(--line); }
  .hero-media { border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9; cursor: pointer; order: 2; }
  .hero-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .55s cubic-bezier(.22,.61,.36,1); }
  .hero-media:hover img { transform: scale(1.04); }
  .hero-text .cat { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-dark);
    display: inline-flex; align-items: center; gap: 6px; }
  .hero-text .cat .swatch { width: 8px; height: 8px; border-radius: 2px; }
  .hero-text h1 { font-family: var(--serif); font-size: clamp(2rem, 3.8vw, 2.95rem); line-height: 1.11; font-weight: 700;
    letter-spacing: -0.01em; margin: 13px 0 0; text-wrap: balance; cursor: pointer; }
  .hero-text h1:hover { color: var(--accent-dark); }
  .hero-text p { margin-top: 14px; color: var(--muted); font-size: 1.04rem; max-width: 48ch; }
  .hero-text .hmeta { display: flex; align-items: center; gap: 11px; margin-top: 18px; }
  .hero-text .hmeta .who { font-size: .86rem; font-weight: 600; color: var(--ink-soft); }
  .hero-text .hmeta .sub { font-size: .78rem; color: var(--muted); }

  /* ===== Kartu ala Google News ===== */
  .ncard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column; transition: box-shadow .18s ease, transform .18s ease, border-color .18s; }
  .ncard:hover { box-shadow: var(--card-shadow); transform: translateY(-2px); border-color: transparent; }
  .ncard .ph { aspect-ratio: 16/9; overflow: hidden; background: var(--panel); }
  .ncard .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.22,.61,.36,1); }
  .ncard:hover .ph img { transform: scale(1.05); }
  .ncard .cbody { padding: 14px 15px 15px; display: flex; flex-direction: column; flex: 1; }
  .ncard .cat { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-dark);
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .ncard .cat .swatch { width: 7px; height: 7px; border-radius: 2px; }
  .ncard h3 { font-family: var(--serif); font-size: 1.14rem; line-height: 1.26; font-weight: 700; letter-spacing: -0.005em; }
  .ncard:hover h3 { color: var(--accent-dark); }
  .ncard .time { font-size: .77rem; color: var(--muted); margin-top: 9px; }
  .ncard .src { display: flex; align-items: center; gap: 9px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
  .avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    font-size: .68rem; font-weight: 700; flex-shrink: 0; font-family: var(--sans); }
  .srcname { font-size: .8rem; font-weight: 600; color: var(--ink-soft); }
  .kebab { margin-left: auto; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 1.15rem;
    width: 30px; height: 30px; border-radius: 50%; line-height: 1; transition: background .16s, color .16s; }
  .kebab:hover { background: var(--panel); color: var(--ink); }

  /* Carousel "Berita utama" */
  .carousel { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 0 14px; margin: 0 -4px;
    scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel .ncard { min-width: 300px; max-width: 300px; scroll-snap-align: start; }

  /* Grid feed */
  .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

  .loadmore { display: block; margin: 26px auto 0; padding: 11px 26px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 999px; font-weight: 600; font-size: .9rem; cursor: pointer; font-family: inherit; transition: .16s; }
  .loadmore:hover { border-color: var(--accent); color: var(--accent-dark); }

  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 46px; margin-top: 34px; align-items: start; }

  /* Rail kanan */
  .rail { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 30px; }
  .rail-box h4 { font-family: var(--serif); font-size: 1.12rem; font-weight: 700; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 2px solid var(--accent); }
  .pop { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: flex-start; }
  .pop:last-child { border-bottom: none; }
  .pop .n { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; color: var(--accent); min-width: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .pop .t { font-size: .93rem; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; }
  .pop:hover .t { color: var(--accent-dark); }
  .pop .m { font-size: .73rem; color: var(--muted); margin-top: 5px; }
  .taglist { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
  .taglist a { background: var(--panel); padding: 6px 13px; border-radius: 999px; font-size: .82rem; cursor: pointer; transition: .16s; }
  .taglist a:hover { background: var(--accent); color: #fff; }
  .nl { background: var(--accent-tint); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: var(--radius); padding: 22px; }
  .nl h4 { font-family: var(--serif); font-size: 1.15rem; margin-bottom: 6px; }
  .nl p { font-size: .86rem; color: var(--muted); margin-bottom: 14px; }
  .nl input { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; outline: none; margin-bottom: 9px; background: var(--surface); color: var(--ink); font-family: inherit; }
  .nl input:focus { border-color: var(--accent); }
  .nl button { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .16s; }
  .nl button:hover { background: var(--accent-dark); }

  /* Artikel */
  .crumb { font-size: .8rem; color: var(--muted); margin: 6px 0 22px; }
  .crumb a { cursor: pointer; } .crumb a:hover { color: var(--accent-dark); }
  .article { max-width: 700px; margin: 0 auto; }
  .article .cat { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-dark); display: inline-flex; align-items: center; gap: 6px; }
  .article .cat .swatch { width: 8px; height: 8px; border-radius: 2px; }
  .article h1 { font-family: var(--serif); font-size: clamp(1.9rem, 3.6vw, 2.6rem); line-height: 1.14; font-weight: 700; letter-spacing: -0.01em; margin: 12px 0 16px; text-wrap: balance; }
  .article .lede { font-family: var(--serif); font-size: 1.24rem; color: var(--ink-soft); line-height: 1.5; margin-bottom: 24px; }
  .a-meta { display: flex; align-items: center; gap: 11px; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  .a-meta .who { font-size: .88rem; font-weight: 600; color: var(--ink-soft); }
  .a-meta .sub { font-size: .78rem; color: var(--muted); }
  .article-media { border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9; margin-bottom: 8px; }
  .article-media img { width: 100%; height: 100%; object-fit: cover; }
  .cap { font-size: .78rem; color: var(--muted); margin-bottom: 28px; padding-top: 8px; }
  .article-body p { font-size: 1.09rem; line-height: 1.75; margin-bottom: 20px; color: var(--ink-soft); }
  .article-body p:first-of-type::first-letter { font-size: 3.2rem; font-weight: 800; float: left; line-height: .82; padding: 4px 12px 0 0; color: var(--accent-dark); }
  .share { display: flex; gap: 10px; align-items: center; margin: 32px 0; flex-wrap: wrap; }
  .share span { font-size: .82rem; color: var(--muted); }
  .share a { padding: 9px 17px; border-radius: 999px; border: 1px solid var(--line); font-size: .83rem; font-weight: 600; cursor: pointer; transition: .16s; }
  .share a:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .empty { text-align: center; padding: 90px 20px; color: var(--muted); }
  .empty h3 { font-family: var(--serif); font-size: 1.5rem; color: var(--ink); margin-bottom: 8px; }
  .empty a { cursor: pointer; color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg);
    padding: 11px 20px; border-radius: 999px; font-size: .86rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Bookmark / simpan */
  .bm { margin-left: auto; border: none; background: none; cursor: pointer; color: var(--muted); width: 30px; height: 30px;
    border-radius: 50%; display: grid; place-items: center; transition: background .16s, color .16s; flex-shrink: 0; }
  .bm:hover { background: var(--panel); color: var(--ink); }
  .bm svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
  .bm.saved { color: var(--accent-dark); }
  .bm.saved svg { fill: currentColor; }
  .save-pill { display: inline-flex; align-items: center; gap: 7px; padding: 9px 17px; border-radius: 999px; border: 1px solid var(--line);
    font-size: .83rem; font-weight: 600; cursor: pointer; background: var(--surface); color: var(--ink); transition: .16s; font-family: inherit; }
  .save-pill svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
  .save-pill:hover { border-color: var(--accent); }
  .save-pill.saved { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-dark); }
  .save-pill.saved svg { fill: currentColor; }
  .nav-saved { position: relative; }
  .badge-count { position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: .63rem; font-weight: 700; display: none; place-items: center; }

  /* Baru dibaca */
  .recent-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 14px; }
  .recent-head h2 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; }
  .recent-head button { border: none; background: none; color: var(--muted); font-size: .82rem; cursor: pointer; font-family: inherit; }
  .recent-head button:hover { color: var(--accent-dark); }
  .recent-row { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 0 4px 6px; margin: 0 -4px; }
  .recent-row::-webkit-scrollbar { display: none; }
  .recent-item { min-width: 290px; max-width: 290px; display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line);
    border-radius: var(--radius-sm); cursor: pointer; background: var(--surface); transition: border-color .16s, box-shadow .16s; }
  .recent-item:hover { border-color: transparent; box-shadow: var(--card-shadow); }
  .recent-item .rthumb { width: 76px; height: 62px; border-radius: 9px; overflow: hidden; flex-shrink: 0; background: var(--panel); }
  .recent-item .rthumb img { width: 100%; height: 100%; object-fit: cover; }
  .recent-item .cat { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-dark); display: inline-flex; align-items: center; gap: 5px; }
  .recent-item .cat .swatch { width: 6px; height: 6px; border-radius: 2px; }
  .recent-item h4 { font-size: .92rem; line-height: 1.28; font-weight: 700; letter-spacing: -0.01em; margin-top: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Baca Juga inline */
  .baca-juga { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 24px 18px 18px; margin: 28px 0; }
  .bj-tag { position: absolute; top: -13px; left: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 5px 14px; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
  .bj-item { display: flex; gap: 16px; align-items: center; cursor: pointer; }
  .bj-thumb { width: 94px; height: 76px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--panel); }
  .bj-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s cubic-bezier(.22,.61,.36,1); }
  .baca-juga:hover .bj-thumb img { transform: scale(1.06); }
  .bj-title { font-weight: 700; font-size: 1.04rem; line-height: 1.3; letter-spacing: -0.01em; }
  .baca-juga:hover .bj-title { color: var(--accent-dark); }
  .bj-date { font-size: .82rem; color: var(--muted); font-style: italic; margin-top: 6px; }

  /* Jajak Pendapat (polling) */
  .poll { border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin: 32px 0; background: var(--panel); }
  .poll-head { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent-dark); margin-bottom: 10px; }
  .poll-q { font-size: 1.16rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 16px; line-height: 1.32; }
  .poll-body { display: flex; flex-direction: column; gap: 10px; }

function pollSeed(id, n){ const arr=[]; let h=(id*2654435761)>>>0; for(let i=0;i<n;i++){ h=(h*1103515245+12345)>>>0; arr.push(60 + (h % 640)); } return arr; }
function pollCounts(id, n){ const c=pollSeed(id,n); const v=polls[id]; if(v!=null && c[v]!=null) c[v]+=1; return c; }
function pollWidget(id){
  const n = NEWS.find(x=>x.id===id); const p = POLL_Q[n.category];
  const counts = pollCounts(id, p.opts.length); const total = counts.reduce((a,b)=>a+b,0);
  const voted = polls[id];
  let body;
  if(voted!=null){
    body = p.opts.map((o,i)=>{ const pct=Math.round(counts[i]/total*100);
      return `<div class="poll-res ${voted===i?'chosen':''}"><div class="poll-bar" data-pct="${pct}" style="width:0"></div>
        <span class="poll-label">${o}${voted===i?" ✓":""}</span><span class="poll-pct">${pct}%</span></div>`; }).join("");
  } else {
    body = p.opts.map((o,i)=>`<button class="poll-opt" data-vote="${i}">${o}</button>`).join("");
  }
  const foot = voted!=null ? `${total.toLocaleString("id-ID")} suara · Makasih sudah ikut memilih!` : `${total.toLocaleString("id-ID")} suara — pilih satu`;
  return `<section class="poll" data-poll="${id}">
    <div class="poll-head">📊 Jajak Pendapat</div>
    <h4 class="poll-q">${p.q}</h4>
    <div class="poll-body">${body}</div>
    <div class="poll-foot">${foot}</div>
  </section>`;
}

function quizBest(){ return LS.get("kabar_quizbest", 0); }
function paint(html){ view.innerHTML=html; view.classList.remove("in"); void view.offsetWidth; view.classList.add("in"); }
function quizIntro(){
  const best = quizBest();
  const inModal = quiz && quiz.modal;
  const title = inModal ? "Selesai baca? 🎉" : "Kuis Kabar";
  const desc = inModal
    ? `Sekalian uji pemahamanmu, yuk. ${QUIZ.length} pertanyaan singkat.`
    : `Seberapa update kamu hari ini? ${QUIZ.length} pertanyaan singkat, kurang dari satu menit.`;
  return `<div class="quiz"><div class="quiz-card quiz-intro">
    <div class="emoji">🧠</div><h1>${title}</h1>
    <p>${desc}</p>
    ${best?`<p class="sub">🏆 Rekor terbaikmu: ${best}/${QUIZ.length}</p>`:""}
    <button class="quiz-next" data-quiz="start" style="max-width:260px;margin-left:auto;margin-right:auto">Mulai kuis →</button>
  </div></div>`;
}
function quizPlay(){
  const item = QUIZ[quiz.i]; const answered = quiz.picked!=null;
  const bars = QUIZ.map((_,k)=>`<span class="${(k<quiz.i)||(k===quiz.i&&answered)?"done":""}"></span>`).join("");
  const opts = item.opts.map((o,i)=>{
    let cls="", mk="";
    if(answered){ if(i===item.a){ cls="correct"; mk="✓"; } else if(i===quiz.picked){ cls="wrong"; mk="✕"; } }
    return `<button class="quiz-opt ${cls}" data-quiz-ans="${i}" ${answered?"disabled":""}>${o.trim()}<span class="mk">${mk}</span></button>`;
  }).join("");
  const last = quiz.i===QUIZ.length-1;
  const next = answered ? `<button class="quiz-next" data-quiz="next">${last?"Lihat hasil":"Lanjut"} →</button>` : "";
  return `<div class="quiz"><div class="quiz-card">
    <div class="quiz-head"><span>Pertanyaan ${quiz.i+1} dari ${QUIZ.length}</span><span>Skor: ${quiz.score}</span></div>
    <div class="quiz-progress">${bars}</div>
    <div class="quiz-q">${item.q}</div>
    <div class="quiz-opts">${opts}</div>
    ${next}
  </div></div>`;
}
function quizResult(){
  const total=QUIZ.length, s=quiz.score, pct=Math.round(s/total*100), best=quizBest();
  const msg = pct===100?"Sempurna! Kamu paling update. 🏆" : pct>=60?"Mantap, wawasanmu oke! 👏" : pct>=40?"Lumayan, tinggal sedikit lagi. 🙂" : "Yuk baca berita lagi, pasti naik! 💪";
  return `<div class="quiz"><div class="quiz-card quiz-score">
    <div class="emoji">🎯</div>
    <div class="big">${s}/${total}</div>
    <p>${msg}</p>
    <p class="sub">Skor ${pct}% · 🏆 Rekor terbaik: ${Math.max(best,s)}/${total}</p>
    <div class="quiz-actions"><button class="quiz-next" data-quiz="restart">Ulangi kuis</button>${
      quiz.modal ? `<button class="quiz-ghost" data-quiz="close">Tutup</button>`
                 : `<button class="quiz-ghost" data-nav="home">Baca berita</button>`}</div>
  </div></div>`;
}
function renderQuiz(){
  const html = (!quiz || quiz.stage==="intro") ? quizIntro() : (quiz.stage==="result" ? quizResult() : quizPlay());
  const el = quizEl || view;
  if(el === view){ document.title = "Kuis — kabar"; paint(html); }
  else { el.innerHTML = html; }
}
function openQuizModal(){
  quizEl = document.getElementById("modal-body");
  quiz = { stage:"intro", modal:true };
  renderQuiz();

function closeQuizModal(){
  const m = document.getElementById("quiz-modal");

}
function quizStart(){ const inModal = !!(quizEl && quizEl.id==="modal-body"); quiz={stage:"play", i:0, score:0, picked:null, modal:inModal}; if(!inModal) window.scrollTo(0,0); renderQuiz(); }
function quizAnswer(i){ if(!quiz||quiz.picked!=null) return; quiz.picked=i; if(i===QUIZ[quiz.i].a) quiz.score++; renderQuiz(); }
function quizNext(){
  if(quiz.i>=QUIZ.length-1){ quiz.stage="result"; if(quiz.score>quizBest()) LS.set("kabar_quizbest", quiz.score); }
  else { quiz.i++; quiz.picked=null; }
  if(!quiz.modal) window.scrollTo(0,0);
  renderQuiz();
  if(quiz.modal){ const mb=document.getElementById("modal-body"); if(mb) mb.parentElement.scrollTop=0; }
}

  const tags = CATEGORIES.map(c=>`<a data-cat="${c}">#${c}</a>`).join("");
  return `<aside><div class="rail">
    <div class="rail-box"><h4>Terpopuler</h4>${pop}</div>
    <div class="rail-box"><h4>Topik</h4><div class="taglist">${tags}</div></div>
    <div class="nl"><h4>Ringkasan pagi</h4><p>Lima berita penting tiap hari, langsung ke inbox. Gratis.</p>
      <form id="nl"><input type="email" placeholder="email kamu…" required><button>Ikutan</button></form></div>
  </div></aside>`;
}

function renderHome(){
  const lead = NEWS.find(n=>n.featured);
  const utama = NEWS.filter(n=>n.featured && n.id!==lead.id).concat(NEWS.filter(n=>!n.featured).slice(0,4));
  const feed = NEWS.filter(n=>!n.featured && n.id!==lead.id);
  view.innerHTML = `
    <section class="hero">
      <div class="hero-media" data-article="${lead.id}"><img src="${lead.image}" alt="${lead.title}"></div>
      <div class="hero-text">
        <span class="cat" data-cat="${lead.category}"><span class="swatch" style="background:${CAT_COLOR[lead.category]}"></span>${lead.category}</span>
        <h1 data-article="${lead.id}">${lead.title}</h1>
        <p>${lead.excerpt}</p>
        <div class="hmeta"><span class="avatar" style="background:${CAT_COLOR[lead.category]}">${initials(lead.author)}</span>
          <div><div class="who">${lead.author}</div><div class="sub">${relTime(lead.mins)} · ${readTime(lead.content)} menit baca</div></div>${bmBtn(lead.id)}</div>
      </div>
    </section>
    <section>
      <div class="sec-head"><h2>Berita utama</h2><span class="eyebrow">Geser untuk lihat →</span></div>
      <div class="carousel">${utama.map(card).join("")}</div>
    </section>
    <div class="layout">
      <main>
        <div class="sec-head"><h2>Terbaru</h2><span class="eyebrow">Update harian</span></div>
        <div class="list">${feed.map(listItem).join("")}</div>
        <button class="loadmore">Muat lebih banyak</button>
      </main>
      ${railHtml()}
    </div>`;
}

function renderList(title, sub, items, docTitle){
  const body = items.length ? `<div class="list">${items.map(listItem).join("")}</div>`
    : `<div class="empty"><h3>Belum ada yang cocok</h3><p>Coba kata kunci atau kategori lain.</p></div>`;
  view.innerHTML = `<div class="layout"><main>
    <div class="sec-head"><h2>${title}</h2><span class="eyebrow">${sub}</span></div>${body}</main>${railHtml()}</div>`;
  document.title = docTitle;
}

function renderSaved(){
  const items = saved.map(id=>NEWS.find(n=>n.id===id)).filter(Boolean);
  const body = items.length ? `<div class="list">${items.map(listItem).join("")}</div>
      <button class="loadmore" id="clear-saved" style="margin-top:22px">Hapus semua simpanan</button>`
    : `<div class="empty"><h3>Belum ada yang disimpan</h3><p>Ketuk ikon 🔖 di kartu atau artikel mana pun untuk menyimpannya di sini.</p></div>`;
  view.innerHTML = `<div class="layout"><main>
    <div class="sec-head"><h2>Tersimpan</h2><span class="eyebrow">${items.length} artikel</span></div>${body}</main>${railHtml()}</div>`;
  document.title = "Tersimpan — kabar";
}

function renderArticle(id){
  const n = NEWS.find(x=>x.id===id);
  if(!n){ view.innerHTML = `<div class="empty"><h3>Artikel tidak ditemukan</h3><p><a data-nav="home">Kembali ke beranda</a></p></div>`; return; }
  document.title = n.title + " — kabar";
  quizAutoShown = false;
  // "Baca Juga" ditarik dari berita lain sekategori (tag), lalu diisi dari kategori lain bila kurang
  let rel = NEWS.filter(x=>x.category===n.category && x.id!==n.id);
  if(rel.length < 2) rel = rel.concat(NEWS.filter(x=>x.category!==n.category && x.id!==n.id));
  rel = rel.slice(0, 2);
  // Sisipkan kotak "Baca Juga" inline setelah paragraf ke-4 dan ke-8
  const content = fullBody(n);
  const bodyParts = [];
  content.forEach((p, idx) => {
    bodyParts.push(`<p>${p}</p>`);
    if(idx===3 && rel[0]) bodyParts.push(inlineRead(rel[0]));
    else if(idx===7 && rel[1]) bodyParts.push(inlineRead(rel[1]));
  });
  view.innerHTML = `
    <div class="crumb"><a data-nav="home">Beranda</a> &nbsp;/&nbsp; <a data-cat="${n.category}">${n.category}</a></div>
    <div class="layout"><main>
      <article class="article">
        <span class="cat" data-cat="${n.category}"><span class="swatch" style="background:${CAT_COLOR[n.category]}"></span>${n.category}</span>
        <h1>${n.title}</h1>
        <p class="lede">${n.excerpt}</p>
        <div class="a-meta"><span class="avatar" style="background:${CAT_COLOR[n.category]}">${initials(n.author)}</span>
          <div><div class="who">${n.author}</div><div class="sub">${fmtLong(n.date)} · ${readTime(content)} menit baca</div></div></div>
        <div class="article-media"><img src="${n.image}" alt="${n.title}"></div>
        <div class="cap">Ilustrasi: ${n.category} · kabar</div>
        <div class="article-body">${bodyParts.join("")}</div>
        <div class="share"><button class="save-pill ${isSaved(n.id)?'saved':''}" data-bm="${n.id}">${BM_SVG}<span class="bmlabel">${isSaved(n.id)?'Tersimpan':'Simpan'}</span></button><span style="margin-left:6px">Bagikan</span><a data-share>Salin tautan</a><a data-share>WhatsApp</a><a data-share>X</a></div>
        ${pollWidget(n.id)}
      </article>
    </main>${railHtml()}</div>`;
  window.scrollTo(0,0);
  animatePolls();
}

function renderNav(){
  const active = route.page==="category" ? route.cat : null;
  document.getElementById("nav-cats").innerHTML =
    `<a data-nav="home" class="${route.page==='home'?'active':''}">Beranda</a>` +
    CATEGORIES.map(c=>`<a data-cat="${c}" class="${active===c?'active':''}">${c}</a>`).join("") +
    `<a data-nav="quiz" class="quiz-link ${route.page==='quiz'?'active':''}">🧠 Kuis</a>`;
}

function go(r){ route=r; renderNav();
  if(r.page==="home") renderHome();
  else if(r.page==="category") renderList(r.cat, "Kategori", NEWS.filter(n=>n.category===r.cat), r.cat+" — kabar");
  else if(r.page==="search"){ const q=r.q.toLowerCase();
    renderList(`“${r.q}”`, "Hasil pencarian", NEWS.filter(n=>(n.title+n.excerpt+n.category).toLowerCase().includes(q)), "Cari — kabar"); }
  else if(r.page==="saved") renderSaved();
  else if(r.page==="quiz"){ quizEl=view; quiz={stage:"intro"}; renderQuiz(); if(typeof onScroll==="function") onScroll(); return; }
  else if(r.page==="article") renderArticle(r.id);
  view.classList.remove("in"); void view.offsetWidth; view.classList.add("in");
  if (typeof onScroll === "function") onScroll();
}

document.addEventListener("click", e=>{
  const pv=e.target.closest("[data-vote]"); if(pv){ e.preventDefault(); const wrap=pv.closest("[data-poll]"); const id=+wrap.dataset.poll;
    polls[id]=+pv.dataset.vote; LS.set("kabar_polls",polls); wrap.outerHTML=pollWidget(id); animatePolls(); showToast("Suara kamu dihitung ✓"); return; }
  if(e.target.id==="modal-close" || e.target.id==="quiz-modal"){ closeQuizModal(); return; }
  if(e.target.id==="auth-close" || e.target.id==="auth-modal"){ closeAuthModal(); return; }
  if(e.target.closest("#login-btn")){ openAuthModal(); return; }
  const acc=e.target.closest("[data-acc]"); if(acc){ login(DEMO_ACCOUNTS[+acc.dataset.acc]); return; }
  if(e.target.closest("#use-other")){ document.getElementById("auth-body").innerHTML=authFormHTML(); return; }
  if(e.target.closest("#user-btn")){ document.getElementById("user-menu").classList.toggle("open"); return; }
  if(e.target.id==="logout"){ logout(); return; }
  const qa=e.target.closest("[data-quiz-ans]"); if(qa){ quizAnswer(+qa.dataset.quizAns); return; }
  const qc=e.target.closest("[data-quiz]"); if(qc){ const act=qc.dataset.quiz;
    if(act==="start"||act==="restart") quizStart(); else if(act==="next") quizNext(); else if(act==="close") closeQuizModal(); return; }
  const bm=e.target.closest("[data-bm]"); if(bm){ e.preventDefault(); e.stopPropagation(); toggleSave(bm.dataset.bm); return; }
  if(e.target.id==="clear-saved"){ saved=[]; LS.set("kabar_saved",saved); updateSavedBadge(); go({page:"saved"}); return; }
  if(e.target.id==="clear-recent"){ recent=[]; LS.set("kabar_recent",recent); go({page:"home"}); return; }
  const sh=e.target.closest("[data-share]"); if(sh){ e.preventDefault(); showToast("Tautan disalin ✓"); return; }
  const lm=e.target.closest(".loadmore"); if(lm){ lm.textContent="Semua berita sudah tampil ✓"; lm.disabled=true; lm.style.opacity=".6"; return; }
  const a=e.target.closest("[data-article]"), c=e.target.closest("[data-cat]"), nv=e.target.closest("[data-nav]");
  if(c){ e.stopPropagation(); window.scrollTo(0,0); go({page:"category", cat:c.dataset.cat}); }
  else if(a){ go({page:"article", id:+a.dataset.article}); }
  else if(nv){ window.scrollTo(0,0); const pg=nv.dataset.nav; go({page: (pg==="saved"||pg==="quiz") ? pg : "home"}); }
  // Tutup menu akun bila klik di luar
  if(!e.target.closest(".user-wrap")){ const um=document.getElementById("user-menu"); if(um) um.classList.remove("open"); }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="search-form"){ const q=e.target.querySelector("input").value.trim(); if(q){window.scrollTo(0,0); go({page:"search", q});} }
  else if(e.target.id==="nl"){ const b=e.target.querySelector("button"); b.textContent="Sip! ✓"; setTimeout(()=>b.textContent="Ikutan",1600); e.target.reset(); }
  else if(e.target.id==="auth-form"){ const f=e.target; login({ name:f.nm.value.trim(), email:f.em.value.trim() }); }
});
document.getElementById("search-mobile").addEventListener("click", ()=>{ const q=prompt("Cari berita:"); if(q&&q.trim()){window.scrollTo(0,0); go({page:"search", q:q.trim()});} });

const root=document.documentElement;
document.getElementById("theme-toggle").addEventListener("click", ()=>{
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  root.setAttribute("data-theme", cur==="dark"?"light":"dark");
});

// Progress bar baca + tombol kembali ke atas
const progress = document.getElementById("progress");
const totop = document.getElementById("totop");
function onScroll(){
  const top = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  const doc = document.documentElement;
  const full = Math.max(doc.scrollHeight, document.body.scrollHeight);
  const max = full - (window.innerHeight || doc.clientHeight);
  const pct = max > 0 ? top / max : 0;
  progress.style.width = (route.page==="article" ? Math.min(100, pct*100) : 0) + "%";
  totop.classList.toggle("show", top > 500);
  // Pop-up kuis setelah selesai baca artikel (sekali per artikel)
  if(route.page==="article" && !quizAutoShown && max>0 && pct>=0.9){
    quizAutoShown = true;
    openQuizModal();
  }
}
window.addEventListener("scroll", onScroll, { passive:true });
totop.addEventListener("click", ()=>window.scrollTo({top:0, behavior:"smooth"}));

document.getElementById("year").textContent=new Date().getFullYear();
document.getElementById("today").textContent=(()=>{const n=new Date();return `${hari[n.getDay()]}, ${fmtLong(n.toISOString())}`;})();
document.getElementById("foot-cats").innerHTML = `<a>Kategori</a>`+CATEGORIES.map(c=>`<a data-cat="${c}">${c}</a>`).join("");
updateSavedBadge();
renderAuthSlot();
go({page:"home"});
</script>

</html>
