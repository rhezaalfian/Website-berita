  :root {
    --bg: #ffffff; --surface: #ffffff; --ink: #111827; --ink-soft: #1f2937; --muted: #6b7280;
    --line: #e5e6e8; --panel: #f2f3f5; --accent: #0fa958; --accent-dark: #0c9049; --accent-tint: #e7f7ee;
    --breaking: #e0201b;
    --radius: 16px; --radius-sm: 12px; --maxw: 1040px;
    --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: var(--sans);
    --reading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --card-shadow: 0 6px 22px rgba(0,0,0,.09);
    --card-rest: 0 1px 2px rgba(20,24,28,.05), 0 4px 12px rgba(20,24,28,.045);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111312; --surface:#191c1a; --ink:#eef0ec; --ink-soft:#cbcfc9; --muted:#8b918b;
      --line:#262a26; --panel:#1b1f1c; --accent:#22c06a; --accent-dark:#1aa85c; --accent-tint:#12241a; --breaking:#f0433d; --card-shadow:0 6px 24px rgba(0,0,0,.5); }
  }
  :root[data-theme="dark"] { --bg:#111312; --surface:#191c1a; --ink:#eef0ec; --ink-soft:#cbcfc9; --muted:#8b918b;
      --line:#262a26; --panel:#1b1f1c; --accent:#22c06a; --accent-dark:#1aa85c; --accent-tint:#12241a; --breaking:#f0433d; --card-shadow:0 6px 24px rgba(0,0,0,.5); }
  :root[data-theme="light"] { --bg:#ffffff; --surface:#ffffff; --ink:#111827; --ink-soft:#1f2937; --muted:#6b7280;
      --line:#e5e6e8; --panel:#f2f3f5; --accent:#0fa958; --accent-dark:#0c9049; --accent-tint:#e7f7ee; --breaking:#e0201b; --card-shadow:0 6px 22px rgba(0,0,0,.09); --card-rest:0 1px 2px rgba(20,24,28,.05), 0 4px 12px rgba(20,24,28,.045); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: clip; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  ::selection { background: var(--accent); color: #fff; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }
  .eyebrow { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }

  @keyframes viewIn { from { opacity: 0; transform: translateY(9px);} to { opacity: 1; transform: none; } }
  #view.in { animation: viewIn .4s cubic-bezier(.22,.61,.36,1); }
  @keyframes scrollLeft { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes pulse2 { 0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;} }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto; } }

  /* Penajaman tipografi */
  .brand, .foot .big { font-weight: 800; letter-spacing: -0.04em; }
  /* Judul editorial pakai serif yang sama dengan badan berita agar menyatu */
  .hero-text h1, .article h1 { font-family: var(--reading); font-weight: 800; letter-spacing: -0.022em; line-height: 1.08; }
  .sec-head h2, .empty h3 { font-weight: 800; letter-spacing: -0.03em; }
  .ncard h3, .list-item h3, .pop .t, .rail-box h4, .nl h4 { font-weight: 700; letter-spacing: -0.02em; }

  /* ===== Header sticky (breaking + nav menempel saat scroll) ===== */
  .site-top { position: sticky; top: 0; z-index: 50; }

  /* ===== Breaking bar (statis, terpusat, bisa ditutup) ===== */
  .breaking-bar { position: relative; display: flex; justify-content: center; align-items: center; gap: 11px; padding: 9px 40px;
    background: var(--surface); border-bottom: 1px solid var(--line); }
  .bn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--breaking); flex-shrink: 0; animation: blink 1s ease-in-out infinite; }
  .bn-label { color: var(--breaking); font-weight: 800; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .bn-head { font-size: .86rem; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 60vw; }
  .bn-head:hover { color: var(--breaking); }
  .bn-close { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--muted);
    cursor: pointer; font-size: .78rem; padding: 4px 7px; border-radius: 6px; line-height: 1; }
  .bn-close:hover { color: var(--breaking); background: var(--panel); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .18; } }

  /* ===== Nav ===== */
  .nav { background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(1.5) blur(14px); border-bottom: 1px solid var(--line); }
  .nav-inner { display: flex; align-items: center; gap: 18px; height: 62px; }
  .brand { font-size: 1.7rem; cursor: pointer; }
  .brand b { color: var(--accent); }
  .nav-secs { display: flex; gap: 4px; margin-left: 14px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav-secs::-webkit-scrollbar { display: none; }
  .nav-secs a { padding: 8px 15px; border-radius: 999px; font-size: .92rem; font-weight: 600; color: var(--ink-soft); white-space: nowrap;
    cursor: pointer; transition: background .16s, color .16s; }
  .nav-secs a:hover { background: var(--panel); color: var(--ink); }
  .nav-secs a.active { color: #fff; }
  .nav-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer; font-size: .95rem; transition: background .16s; }
  .icon-btn:hover { background: var(--panel); }
  .search-inline { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 0 6px 0 14px; height: 37px; }
  .search-inline input { border: none; background: none; outline: none; color: var(--ink); font-size: .85rem; width: 130px; font-family: inherit; }
  .search-inline button { border: none; background: var(--accent); color: #fff; width: 27px; height: 27px; border-radius: 999px; cursor: pointer; font-size: .8rem; }
  #search-mobile { display: none; }  /* di desktop cukup kotak pencarian; ikon hanya untuk mobile */

  /* ===== Mega menu ===== */
  .mega-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 140; opacity: 0; pointer-events: none; transition: opacity .22s; }
  .mega-overlay.open { opacity: 1; pointer-events: auto; }
  .mega { position: fixed; top: 0; left: 0; right: 0; z-index: 145; background: var(--bg); border-bottom: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(0,0,0,.22); transform: translateY(-100%); transition: transform .3s cubic-bezier(.22,.61,.36,1); max-height: 92vh; overflow: auto; }
  .mega-overlay.open + .mega, .mega.open { transform: none; }
  .mega-top { display: flex; align-items: center; justify-content: space-between; height: 62px; }
  .mega-search { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 8px 0 16px; height: 50px; margin: 4px 0 22px; transition: border-color .16s; }
  .mega-search:focus-within { border-color: var(--accent); }
  .mega-search .ms-ico { font-size: 1.15rem; color: var(--muted); }
  .mega-search input { flex: 1; min-width: 0; border: none; background: none; outline: none; color: var(--ink); font-size: 1rem; font-family: inherit; }
  .mega-search button { border: none; background: var(--accent); color: #fff; height: 36px; padding: 0 18px; border-radius: 9px; font-weight: 700;
    font-size: .88rem; cursor: pointer; font-family: inherit; transition: background .16s; }
  .mega-search button:hover { background: var(--accent-dark); }
  .mega-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; padding: 8px 0 34px; }
  .mega-sec { border-top: 3px solid var(--sc); padding-top: 16px; }
  .mega-h { display: inline-flex; align-items: center; gap: 8px; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em; cursor: pointer;
    color: var(--ink); background: none; border: none; font-family: inherit; padding: 0; margin-bottom: 14px; }
  .mega-h .arw { color: var(--sc); transition: transform .16s; }
  .mega-h:hover .arw { transform: translateX(4px); }
  .mega-tags { display: flex; flex-wrap: wrap; gap: 9px; }
  .mega-tags a { padding: 8px 14px; border-radius: 10px; background: var(--panel); font-size: .9rem; font-weight: 500; cursor: pointer;
    transition: background .16s, color .16s; }
  .mega-tags a:hover { background: var(--sc); color: #fff; }
  .mega-foot { display: flex; gap: 10px; flex-wrap: wrap; padding: 18px 0 26px; border-top: 1px solid var(--line); }
  .mega-foot button { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-weight: 600; font-size: .88rem; cursor: pointer; font-family: inherit; transition: .16s; }
  .mega-foot button:hover { border-color: var(--accent); color: var(--accent-dark); }

  /* Bar topik hangat (di bawah menu) */
  .trending-bar { border-bottom: 1px solid var(--line); background: var(--surface); }
  .trending-bar .wrap { display: flex; align-items: center; gap: 14px; height: 46px; position: relative; }
  /* penanda samar di kanan: menandakan chip masih bisa digeser */
  .trending-bar .wrap::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 38px; pointer-events: none;
    background: linear-gradient(to right, transparent, var(--surface)); }
  .tb-label { font-size: 1.1rem; white-space: nowrap; display: flex; align-items: center; transform-origin: 50% 85%;
    animation: flame 1.3s ease-in-out infinite; }
  @keyframes flame {
    0%,100% { transform: scale(1) rotate(-3deg); }
    20% { transform: scale(1.14) rotate(3deg); }
    40% { transform: scale(0.95) rotate(-2deg); }
    60% { transform: scale(1.1) rotate(2deg); }
    80% { transform: scale(1.02) rotate(-1deg); }
  }
  .tb-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .tb-chips::-webkit-scrollbar { display: none; }
  .tb-chips a { white-space: nowrap; padding: 6px 13px; border-radius: 999px; background: var(--panel); font-size: .82rem; font-weight: 500;
    cursor: pointer; transition: background .16s, color .16s; display: inline-flex; align-items: center; gap: 7px; color: var(--ink-soft); }
  .tb-chips a:hover { background: var(--accent); color: #fff; }
  .tb-chips a .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
  .tb-chips a:hover .dot { background: #fff !important; }

  main { padding: 30px 0 20px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
  .sec-head h2 { font-size: 1.4rem; }
  .sec-head h2 .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 9px; vertical-align: middle; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .71rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--ink); cursor: pointer; }
  .chip .swatch { width: 8px; height: 8px; border-radius: 3px; }
  .meta { font-size: .81rem; color: var(--muted); display: flex; gap: 13px; align-items: center; flex-wrap: wrap; }
  .meta .who { color: var(--ink-soft); font-weight: 600; }

  /* Hero slider */
  .hero-slider { position: relative; overflow: hidden; padding-bottom: 38px; margin-bottom: 30px; border-bottom: 1px solid var(--line); }
  .hs-track { display: flex; transition: transform .55s cubic-bezier(.22,.61,.36,1); }
  .hs-slide { min-width: 100%; }
  .hs-slide .hero { padding-bottom: 0; margin: 26px 0 0; border-bottom: none; }
  .hs-arrow { position: absolute; top: 46%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(4px);
    color: var(--ink); font-size: 1.5rem; line-height: 1; cursor: pointer; z-index: 3; display: grid; place-items: center;
    opacity: 0; transition: opacity .18s, background .16s, border-color .16s; }
  .hero-slider:hover .hs-arrow { opacity: 1; }
  .hs-arrow:hover { background: var(--surface); border-color: var(--accent); color: var(--accent-dark); }
  .hs-arrow.prev { left: 4px; } .hs-arrow.next { right: 4px; }
  .hs-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 3; }
  .hs-dot { width: 9px; height: 9px; border-radius: 50%; border: none; background: var(--line); cursor: pointer; padding: 0; transition: width .25s, background .25s; }
  .hs-dot.active { background: var(--accent); width: 24px; border-radius: 5px; }

  /* Hero */
  .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; padding-bottom: 32px; margin-bottom: 30px; border-bottom: 1px solid var(--line); }
  .hero-media { border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; cursor: pointer; order: 2; }
  .hero-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .55s cubic-bezier(.22,.61,.36,1); }
  .hero-media:hover img { transform: scale(1.04); }
  .hero-text .chip { margin-bottom: 4px; }
  .hero-text h1 { font-size: clamp(2rem, 3.8vw, 2.95rem); margin: 13px 0 0; text-wrap: balance; cursor: pointer; }
  .hero-text h1:hover { color: var(--accent-dark); }
  .hero-text p { margin-top: 14px; color: var(--muted); font-size: 1rem; line-height: 1.5; letter-spacing: normal; word-spacing: normal; max-width: 48ch; }
  .hero-text .hmeta { display: flex; align-items: center; gap: 11px; margin-top: 18px; }
  .hero-text .hmeta .who { font-size: .86rem; font-weight: 600; color: var(--ink-soft); }
  .hero-text .hmeta .sub { font-size: .78rem; color: var(--muted); }

  /* Kartu */
  .ncard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column; box-shadow: var(--card-rest, none);
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s; }
  .ncard:hover { box-shadow: var(--card-shadow); transform: translateY(-2px); border-color: transparent; }
  .ncard .ph { aspect-ratio: 16/9; overflow: hidden; background: var(--panel); }
  .ncard .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.22,.61,.36,1); }
  .ncard:hover .ph img { transform: scale(1.05); }
  .ncard .cbody { padding: 14px 15px 15px; display: flex; flex-direction: column; flex: 1; }
  .ncard .chip { margin-bottom: 8px; }
  .ncard h3 { font-size: 1.14rem; line-height: 1.26; }
  .ncard:hover h3 { color: var(--accent-dark); }
  .ncard .time { font-size: .77rem; color: var(--muted); margin-top: 9px; }
  .ncard .src { display: flex; align-items: center; gap: 9px; margin-top: auto; padding-top: 13px; border-top: 1px solid var(--line); }
  .ncard .time { margin-bottom: 2px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .68rem; font-weight: 700; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .auav { cursor: pointer; transition: box-shadow .16s; }
  .auav:hover { box-shadow: 0 0 0 2px var(--accent); }
  .aulink { cursor: pointer; }
  .aulink:hover { color: var(--accent-dark); }

  /* Logo berbagi */
  .share-label { font-size: .82rem; color: var(--muted); margin-right: 2px; }
  .sh-btn { width: 38px; height: 38px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--line);
    background: var(--surface); color: var(--brand); cursor: pointer; transition: background .16s, transform .16s, border-color .16s; }
  .sh-btn svg { width: 18px; height: 18px; }
  .sh-btn:hover { background: var(--brand); border-color: var(--brand); color: #fff; transform: translateY(-2px); }

  /* Follow (Google News + sumber pilihan — dua pil senada) */
  .follow-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 0; }
  .gnews-block { margin-top: 18px; text-align: center; }
  .gnews-label { display: block; font-size: .82rem; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .follow-btn { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-size: .85rem; font-weight: 600; cursor: pointer; transition: border-color .16s, background .16s; }
  .follow-btn svg { width: 17px; height: 17px; }
  .follow-btn:hover { border-color: var(--accent); background: var(--panel); }
  .follow-link { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font-size: .85rem; font-weight: 600; cursor: pointer; transition: border-color .16s, color .16s; }
  .follow-link:hover { border-color: var(--accent); color: var(--accent-dark); }
  .follow-link svg { width: 16px; height: 16px; }
  .foot-follow { margin-top: 16px; }
  @media (max-width: 560px) { .artbar-div { display: none; } .share { gap: 8px; } }

  /* Halaman penulis */
  .author-head { display: flex; gap: 20px; align-items: center; padding: 4px 0; }
  .avatar.xl { width: 88px; height: 88px; }
  .au-role { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--accent-dark); }
  .au-name { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; margin: 4px 0 8px; }
  .au-bio { color: var(--muted); font-size: .95rem; max-width: 56ch; line-height: 1.5; }
  .srcname { font-size: .8rem; font-weight: 600; color: var(--ink-soft); }

  .carousel { display: flex; align-items: stretch; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 4px 14px; margin: 0 -4px; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel .ncard { min-width: 300px; max-width: 300px; scroll-snap-align: start; }

  .loadmore { display: block; margin: 26px auto 0; padding: 11px 26px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 999px; font-weight: 600; font-size: .9rem; cursor: pointer; font-family: inherit; transition: .16s; }
  .loadmore:hover { border-color: var(--accent); color: var(--accent-dark); }

  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 46px; margin-top: 34px; align-items: start; }
  .layout > * { min-width: 0; }  /* cegah carousel di dalam artikel memaksa kolom melebar (overflow horizontal) */

  /* Feed list */
  .list-item { display: grid; grid-template-columns: 1fr 140px; gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
  .list-item:first-child { padding-top: 4px; }
  .li-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .li-sep { color: var(--muted); }
  .li-time { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .list-item .chip { font-size: .68rem; }
  .list-item h3 { font-size: 1.2rem; line-height: 1.28; margin-bottom: 6px; }
  .list-item:hover h3 { color: var(--accent-dark); }
  .list-item p { color: var(--muted); font-size: .9rem; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list-item .src { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
  .list-item .src .srcname { color: var(--ink-soft); font-weight: 600; }
  .list-item .thumb { border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; background: var(--panel); }
  .list-item .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.22,.61,.36,1); }
  .list-item:hover .thumb img { transform: scale(1.05); }
  .avatar.sm { width: 22px; height: 22px; font-size: .6rem; }
  .bm { margin-left: auto; border: none; background: none; cursor: pointer; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; transition: background .16s, color .16s; flex-shrink: 0; }
  .bm:hover { background: var(--panel); color: var(--ink); }
  .bm svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
  .bm.saved { color: var(--accent-dark); } .bm.saved svg { fill: currentColor; }

  /* Rail */
  .rail { position: sticky; top: calc(var(--head-h, 62px) + 16px); display: flex; flex-direction: column; gap: 30px; }
  .rail-box h4 { font-size: 1.12rem; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 2px solid var(--accent); }
  .pop { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: flex-start; }
  .pop:last-child { border-bottom: none; }
  .pop .n { font-size: 1.5rem; font-weight: 800; color: var(--accent); min-width: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .pop .t { font-size: .93rem; font-weight: 600; line-height: 1.3; }
  .pop:hover .t { color: var(--accent-dark); }
  .pop .m { font-size: .73rem; color: var(--muted); margin-top: 5px; }
  .taglist { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
  .taglist a { background: var(--panel); padding: 6px 13px; border-radius: 999px; font-size: .82rem; cursor: pointer; transition: .16s; }
  .taglist a:hover { background: var(--accent); color: #fff; }
  .nl { background: var(--accent-tint); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: var(--radius); padding: 22px; }
  .nl h4 { font-size: 1.15rem; margin-bottom: 6px; }
  .nl p { font-size: .86rem; color: var(--muted); margin-bottom: 14px; }
  .nl input { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; outline: none; margin-bottom: 9px; background: var(--surface); color: var(--ink); font-family: inherit; }
  .nl input:focus { border-color: var(--accent); }
  .nl button { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .16s; }
  .nl button:hover { background: var(--accent-dark); }

  /* Artikel */
  .crumb { font-size: .8rem; color: var(--muted); margin: 6px 0 22px; }
  .crumb a { cursor: pointer; } .crumb a:hover { color: var(--accent-dark); }
  .article { max-width: 700px; margin: 0 auto; }
  .article h1 { font-size: clamp(1.9rem, 3.6vw, 2.6rem); margin: 12px 0 16px; text-wrap: balance; }
  .article .lede { font-family: var(--reading); font-size: 1.1rem; color: var(--ink-soft); line-height: 1.55; letter-spacing: normal; word-spacing: normal; margin-bottom: 20px; }
  .a-meta { display: flex; align-items: center; gap: 11px; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  .a-meta .who { font-size: .88rem; font-weight: 600; color: var(--ink-soft); }
  .a-meta .sub { font-size: .78rem; color: var(--muted); }
  .article-media { border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 8px; }
  .article-media img { width: 100%; height: 100%; object-fit: cover; }
  .cap { font-size: .78rem; color: var(--muted); margin-bottom: 28px; padding-top: 8px; }
  .article-body { font-family: var(--reading); font-size: var(--afs, 1rem); color: var(--ink-soft); }
  .article-body p { font-size: inherit; line-height: 1.6; letter-spacing: normal; word-spacing: normal; margin-bottom: 1em; }
  .article-body b, .article-body strong, .article-body .dateline { color: var(--ink); font-weight: 700; }
  .article-body em, .article-body i { font-style: italic; }

  /* Kontrol ukuran teks */
  .fs-control { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; margin-bottom: 18px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .fs-label { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .fs-seg { display: flex; align-items: center; gap: 8px; }
  .fs-name { font-size: .78rem; color: var(--ink-soft); font-weight: 600; min-width: 84px; text-align: right; }
  .fs-btn { min-width: 40px; height: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px;
    cursor: pointer; color: var(--ink); font-family: inherit; font-weight: 700; transition: .16s; }
  .fs-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-tint); }
  .fs-btn:disabled { opacity: .4; cursor: default; }
  .fs-btn .s { font-size: .78rem; } .fs-btn .l { font-size: 1.05rem; }
  /* Kredit editor (teks; di CMS diisi dari nama editor) */
  .editor-credit { margin-top: 26px; font-size: .9rem; color: var(--muted); }
  .editor-credit b { color: var(--ink-soft); font-weight: 700; }

  /* Tag setelah berita — narasi dengan tautan inline */
  .tag-narasi { margin: 22px 0 8px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .96rem; line-height: 1.65; }
  .ntag { color: var(--accent-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; cursor: pointer; transition: color .16s; }
  .ntag:hover { color: var(--accent); text-decoration-thickness: 2px; }

  .share-zone { margin: 22px 0 24px; padding-top: 22px; border-top: 1px solid var(--line); }
  .share { display: flex; gap: 8px; align-items: center; margin: 0; flex-wrap: wrap; }
  .artbar-div { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .save-pill { height: 38px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line); font-size: .84rem; font-weight: 600; cursor: pointer; transition: .16s; background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 7px; font-family: inherit; }
  .save-pill svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
  .save-pill.saved { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-dark); }
  .save-pill.saved svg { fill: currentColor; }

  /* Rekomendasi untukmu (kartu di akhir artikel — lebih ramping, menyesuaikan kolom baca) */
  .rec-reads { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line); }
  .rec-reads .sec-head { margin-bottom: 16px; }
  .rec-reads .sec-head h2 { font-size: 1.3rem; }
  /* slide seperti Berita utama, tapi kartu diramping agar pas ~3 terlihat utuh */
  .rec-reads .carousel .ncard, .cat-sub .carousel .ncard, .carousel.sm-cards .ncard { min-width: 216px; max-width: 216px; }
  .rec-reads .carousel .ncard h3, .cat-sub .carousel .ncard h3, .carousel.sm-cards .ncard h3 { font-size: 1.04rem; }
  .rec-reads .carousel .ncard .cbody, .cat-sub .carousel .ncard .cbody, .carousel.sm-cards .ncard .cbody { padding: 12px 13px 13px; }
  .rec-reads .carousel .ncard .src .srcname, .cat-sub .carousel .ncard .src .srcname, .carousel.sm-cards .ncard .src .srcname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Baca Juga inline */
  .baca-juga { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 24px 18px 18px; margin: 28px 0; }
  .bj-tag { position: absolute; top: -13px; left: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 5px 14px; font-size: .68em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
  .bj-item { display: flex; gap: 16px; align-items: center; cursor: pointer; }
  .bj-thumb { width: 5.5em; height: 4.4em; border-radius: 7px; overflow: hidden; flex-shrink: 0; background: var(--panel); }
  .bj-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s cubic-bezier(.22,.61,.36,1); }
  .baca-juga:hover .bj-thumb img { transform: scale(1.06); }
  .bj-title { font-weight: 700; font-size: 1em; line-height: 1.3; letter-spacing: -0.01em; }
  .baca-juga:hover .bj-title { color: var(--accent-dark); }
  .bj-date { font-size: .78em; color: var(--muted); font-style: italic; margin-top: 5px; }

  /* Polling */
  .poll { border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin: 32px 0; background: var(--panel); }
  .poll-head { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent-dark); margin-bottom: 10px; }
  .poll-q { font-size: 1.16rem; font-weight: 700; margin-bottom: 16px; line-height: 1.32; }
  .poll-body { display: flex; flex-direction: column; gap: 10px; }
  .poll-opt { text-align: left; padding: 13px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; font-size: .95rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: .16s; }
  .poll-opt:hover { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-dark); }
  .poll-res { position: relative; padding: 13px 16px; border-radius: 11px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .poll-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent-tint); z-index: 0; transition: width .75s cubic-bezier(.22,.61,.36,1); }
  .poll-res.chosen { border-color: var(--accent); } .poll-res.chosen .poll-bar { background: color-mix(in srgb, var(--accent) 24%, transparent); }
  .poll-label { position: relative; z-index: 1; font-size: .93rem; font-weight: 600; }
  .poll-pct { position: relative; z-index: 1; font-size: .9rem; font-weight: 700; color: var(--accent-dark); font-variant-numeric: tabular-nums; }
  .poll-foot { margin-top: 14px; font-size: .8rem; color: var(--muted); }

  .empty { text-align: center; padding: 90px 20px; color: var(--muted); }
  .empty h3 { font-size: 1.5rem; color: var(--ink); margin-bottom: 8px; }
  .empty a { cursor: pointer; color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }

  .progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 60; transition: width .1s linear; }
  .totop { position: fixed; right: 20px; bottom: 20px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.2rem; cursor: pointer; box-shadow: var(--card-shadow); z-index: 60; display: grid; place-items: center; opacity: 0; pointer-events: none; transform: translateY(12px); transition: opacity .22s, transform .22s; }
  .totop.show { opacity: 1; pointer-events: auto; transform: none; }
  .totop:hover { border-color: var(--accent); color: var(--accent-dark); }

  /* Iklan parallax — gambar "terpaku" ke layar, band-nya menggulung di atasnya (full-bleed) */

function img(seed, tag){
  let h=0; for(const c of (tag+seed)) h=(h*31+c.charCodeAt(0))>>>0;
  const hue=h%360, c0=`hsl(${hue},46%,86%)`, c1=`hsl(${hue},44%,68%)`;
  const x=140+(h%600), y=80+((h>>4)%280), x2=140+((h>>7)%600);
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='960' height='540'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c0}'/><stop offset='1' stop-color='${c1}'/></linearGradient></defs>
    <rect width='960' height='540' fill='url(#g)'/><circle cx='${x}' cy='${y}' r='140' fill='rgba(255,255,255,.34)'/>
    <circle cx='${x2}' cy='470' r='84' fill='rgba(0,0,0,.05)'/>
    <text x='42' y='500' fill='rgba(20,22,20,.5)' font-family='-apple-system,Segoe UI,Arial' font-size='24' font-weight='700' letter-spacing='1'>${tag.toUpperCase()}</text></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}
function imgParallax(seed){ let h=0; for(const c of ("px"+seed)) h=(h*31+c.charCodeAt(0))>>>0;
  const hue=h%360;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900'>
    <defs><linearGradient id='pg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue},68%,56%)'/><stop offset='1' stop-color='hsl(${(hue+38)%360},66%,40%)'/></linearGradient></defs>
    <rect width='1200' height='900' fill='url(#pg)'/>
    <circle cx='250' cy='210' r='300' fill='hsla(${(hue+185)%360},72%,70%,.38)'/>
    <circle cx='1000' cy='700' r='360' fill='rgba(255,255,255,.16)'/>
    <circle cx='900' cy='150' r='140' fill='rgba(0,0,0,.12)'/>
    <rect x='-120' y='620' width='1600' height='150' transform='rotate(-9 600 690)' fill='rgba(255,255,255,.10)'/></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg).replace(/'/g,"%27").replace(/\(/g,"%28").replace(/\)/g,"%29");
}

let polls=LS.get("kabar_polls",{});
const POLL_Q={ News:{q:"Menurutmu, isu ini penting untuk terus dikawal?",opts:["Sangat penting","Cukup penting","Tidak terlalu"]},
  SHEroes:{q:"Seberapa relevan cerita ini buat kamu?",opts:["Sangat relevan","Lumayan","Kurang relevan"]},
  HALALive:{q:"Tertarik menerapkan hal ini dalam keseharian?",opts:["Sangat tertarik","Mungkin nanti","Belum tertarik"]} };
function pollSeed(id,n){ const a=[]; let h=(id*2654435761)>>>0; for(let i=0;i<n;i++){ h=(h*1103515245+12345)>>>0; a.push(60+(h%640)); } return a; }
function pollCounts(id,n){ const c=pollSeed(id,n); const v=polls[id]; if(v!=null&&c[v]!=null) c[v]+=1; return c; }
function pollWidget(id){ const n=NEWS.find(x=>x.id===id); const p=POLL_Q[n.section]; const c=pollCounts(id,p.opts.length); const total=c.reduce((a,b)=>a+b,0); const v=polls[id]; let body;
  if(v!=null){ body=p.opts.map((o,i)=>{ const pct=Math.round(c[i]/total*100); return `<div class="poll-res ${v===i?'chosen':''}"><div class="poll-bar" data-pct="${pct}" style="width:0"></div><span class="poll-label">${o}${v===i?" ✓":""}</span><span class="poll-pct">${pct}%</span></div>`; }).join(""); }
  else { body=p.opts.map((o,i)=>`<button class="poll-opt" data-vote="${i}">${o}</button>`).join(""); }
  const foot=v!=null?`${total.toLocaleString("id-ID")} suara · Makasih sudah memilih!`:`${total.toLocaleString("id-ID")} suara — pilih satu`;
  return `<section class="poll" data-poll="${id}"><div class="poll-head">📊 Jajak Pendapat</div><h4 class="poll-q">${p.q}</h4><div class="poll-body">${body}</div><div class="poll-foot">${foot}</div></section>`; }

function heroGoTo(i){ if(!heroCount) return; heroIdx=(i%heroCount+heroCount)%heroCount; const t=document.getElementById("hs-track"); if(t) t.style.transform=`translateX(-${heroIdx*100}%)`;
  document.querySelectorAll("[data-hs-dot]").forEach((d,k)=>d.classList.toggle("active",k===heroIdx)); }
function heroNext(){ heroGoTo(heroIdx+1); }
function heroStop(){ if(heroTimer){ clearInterval(heroTimer); heroTimer=null; } }
function heroStart(){ heroStop(); if(heroCount>1) heroTimer=setInterval(heroNext,5000); }
function heroSetup(){ const sl=document.getElementById("hero-slider"); if(!sl) return; heroIdx=0;
  sl.addEventListener("mouseenter",heroStop); sl.addEventListener("mouseleave",heroStart);
  let sx=0; sl.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; heroStop(); },{passive:true});
  sl.addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){ dx<0?heroNext():heroGoTo(heroIdx-1); } heroStart(); },{passive:true});
  heroStart(); }

function tldrFor(n){ return [n.content[0],n.content[1],n.content[2]].filter(Boolean).map(s=>{ let f=s.split(/\.\s/)[0].trim(); return f.endsWith(".")?f:f+"."; }).slice(0,3); }

// -- Dengarkan (text-to-speech)
let tts={on:false,id:null}, _voices=[];
function loadVoices(){ try{ _voices=(window.speechSynthesis&&window.speechSynthesis.getVoices())||[]; }catch(e){} }
if(window.speechSynthesis){ loadVoices(); try{ window.speechSynthesis.onvoiceschanged=loadVoices; }catch(e){} }
function pickVoice(){ const vs=_voices.length?_voices:(window.speechSynthesis?window.speechSynthesis.getVoices():[]);
  return vs.find(v=>/id[-_]ID/i.test(v.lang)&&/google|natural|neural|damayanti|andika/i.test(v.name)) || vs.find(v=>/id[-_]ID/i.test(v.lang)) || vs.find(v=>/indones/i.test(v.name)) || null; }
function ttsToggle(id){ id=+id; const s=window.speechSynthesis; if(!s){ showToast("Perangkat tak mendukung suara"); return; }
  if(tts.on&&tts.id===id){ s.cancel(); tts.on=false; updateTts(); return; }
  s.cancel(); const n=NEWS.find(x=>x.id===id);
  // pecah per kalimat agar jeda lebih alami (tidak monoton)
  const sentences=(n.title+". "+n.excerpt+" "+fullBody(n).join(" ")).match(/[^.!?]+[.!?]+/g)||[n.title];
  const v=pickVoice();
  sentences.forEach((snt,i)=>{ const u=new SpeechSynthesisUtterance(snt.trim()); u.lang="id-ID"; if(v)u.voice=v; u.rate=0.95; u.pitch=1.06;
    if(i===sentences.length-1) u.onend=u.onerror=()=>{ tts.on=false; updateTts(); }; s.speak(u); });
  tts.on=true; tts.id=id; updateTts(); showToast(v?`Memutar (suara: ${v.name.split(" ").slice(-1)}) 🔊`:"Memutar (suara bawaan perangkat) 🔊"); }
function ttsStop(){ try{ window.speechSynthesis&&window.speechSynthesis.cancel(); }catch(e){} tts.on=false; }
function updateTts(){ const b=document.getElementById("tts-btn"); if(b) b.innerHTML=tts.on?"⏸ Hentikan":"🔊 Dengarkan"; }

    <div class="kr-thumb"><img src="${n.image}" alt="${n.title}" loading="lazy"></div></article>`).join("")}</div>`; }
function renderTag(tag){ const ent=ENTITIES[tag]; const arts=NEWS.filter(n=>n.tag===tag||(n.kw||[]).includes(tag));

// ===== URL & SEO (skema ala periskop) =====
const SITE_URL="https://kabar.id"; // ganti ke domain asli saat deploy
function slugify(s){ return (s||"").toString().toLowerCase().normalize("NFKD").replace(/[^a-z0-9\s-]/g,"").trim().replace(/[\s-]+/g,"-").replace(/^-+|-+$/g,""); }
function artHref(n){ return `#/${slugify(n.tag)}/${(n.date||"").replace(/-/g,"")}/${slugify(n.title)}`; }
function tagHref(t){ return `#/tags/${slugify(t)}`; }
function secHref(s){ return `#/${slugify(s)}`; }
function authorHref(a){ return `#/penulis/${slugify(a)}`; }
// -- Foto & waktu untuk JSON-LD / share (SEO)
// Foto asli per artikel. Kosong -> pakai path konvensi (diisi CMS saat deploy). id -> URL .jpg
const IMG = { /* contoh: 1:"https://kabar.id/img/foto-stimulus.jpg" */ };
// Waktu pembaruan (dateModified) kalau beda dari terbit. Format "YYYY-MM-DD HH.MM" (WIB).
const UPDATED = { 4:"2026-06-30 22.10" };
function isoWIB(dateStr,jam){ return `${dateStr}T${(jam||"00.00").replace(".",":")}:00+07:00`; }
function pubISO(n){ return isoWIB(n.date,n.jam); }
function modISO(n){ const u=UPDATED[n.id]; if(!u) return pubISO(n); const sp=u.split(" "); return isoWIB(sp[0],sp[1]); }
function shareImg(n){ return IMG[n.id] || `${SITE_URL}/img/${slugify(n.tag)}/${(n.date||"").replace(/-/g,"")}/${slugify(n.title)}-1200x675.jpg`; }
function routePath(r){
  if(r.page==="article"){ const n=NEWS.find(x=>x.id===r.id); return n?artHref(n).slice(1):"/"; }
  if(r.page==="tag") return `/tags/${slugify(r.tag)}`;
  if(r.page==="section") return `/${slugify(r.section)}`;
  if(r.page==="author") return `/penulis/${slugify(r.author)}`;
  if(r.page==="search") return `/cari/${slugify(r.q)}`;
  if(r.page==="saved") return "/tersimpan";
  if(r.page==="quiz") return "/kuis";
  if(r.page==="index") return "/indeks";
  if(r.page==="foto") return "/foto";
  if(r.page==="foto-essay"){ const e=PHOTO_ESSAYS.find(x=>x.id===r.id); return e?"/foto/"+slugify(e.title):"/foto"; }
  return "/";
}
function allTagNames(){ const s=new Set(); Object.values(SECTION_TAGS).forEach(a=>a.forEach(t=>s.add(t))); NEWS.forEach(n=>(n.kw||[]).forEach(k=>s.add(k))); Object.keys(ENTITIES).forEach(k=>s.add(k)); return [...s]; }
function findBySlug(list,slug){ return list.find(x=>slugify(x)===slug); }
function parsePath(hash){ let p=(hash||"").replace(/^#/,"").replace(/^\/+|\/+$/g,""); if(!p) return {page:"home"}; const g=p.split("/");
  if(g[0]==="tags"&&g[1]){ const t=findBySlug(allTagNames(),g[1]); return t?{page:"tag",tag:t}:{page:"home"}; }
  if(g[0]==="penulis"&&g[1]){ const a=findBySlug(NEWS.map(n=>n.author).concat(Object.keys(AUTHORS)),g[1]); return a?{page:"author",author:a}:{page:"home"}; }
  if(g[0]==="cari"&&g[1]) return {page:"search",q:decodeURIComponent(g[1]).replace(/-/g," ")};
  if(g[0]==="tersimpan") return {page:"saved"};
  if(g[0]==="kuis") return {page:"quiz"};
  if(g[0]==="indeks") return {page:"index"};
  if(g[0]==="foto"&&g[1]){ const e=peFindSlug(g[1]); return e?{page:"foto-essay",id:e.id}:{page:"foto"}; }
  if(g[0]==="foto") return {page:"foto"};
  if(g.length>=3){ const n=NEWS.find(x=>slugify(x.title)===g[2]); if(n) return {page:"article",id:n.id}; }
  if(g.length===1){ const s=findBySlug(SECTIONS,g[0]); if(s) return {page:"section",section:s}; const t=findBySlug(allTagNames(),g[0]); if(t) return {page:"tag",tag:t}; }
  return {page:"home"};
}
function _headMeta(key,val,attr){ attr=attr||"name"; let m=document.head.querySelector(`meta[${attr}="${key}"]`); if(!m){ m=document.createElement("meta"); m.setAttribute(attr,key); document.head.appendChild(m);} m.setAttribute("content",val||""); }
function _headCanon(url){ let l=document.head.querySelector('link[rel="canonical"]'); if(!l){ l=document.createElement("link"); l.setAttribute("rel","canonical"); document.head.appendChild(l);} l.setAttribute("href",url); }
function _headLd(obj){ let s=document.getElementById("ld-json"); if(!s){ s=document.createElement("script"); s.type="application/ld+json"; s.id="ld-json"; document.head.appendChild(s);} s.textContent=obj?JSON.stringify(obj):"{}"; }
function ldType(kind){ return kind==="lembaga"?"Organization":kind==="orang"?"Person":"Thing"; }
function updateHead(r){ const url=SITE_URL+routePath(r); let title="kabar — portal berita", desc="Portal berita ringkas dengan liputan yang enak dibaca.", ld=null, ogtype="website", ogImage="";
  if(r.page==="article"){ const n=NEWS.find(x=>x.id===r.id); if(n){ title=n.title+" — kabar"; desc=n.excerpt; ogtype="article"; ogImage=shareImg(n);
    ld={"@context":"https://schema.org","@type":"NewsArticle","headline":n.title,"description":n.excerpt,
      "datePublished":pubISO(n),"dateModified":modISO(n),"articleSection":n.tag,
      "image":{"@type":"ImageObject","url":shareImg(n),"width":1200,"height":675},
      "author":{"@type":"Person","name":n.author,"url":SITE_URL+"/penulis/"+slugify(n.author)},
      "publisher":{"@type":"Organization","name":"kabar","logo":{"@type":"ImageObject","url":SITE_URL+"/logo.png","width":512,"height":60}},
      "mainEntityOfPage":url,
      "about":(n.kw||[]).filter(k=>ENTITIES[k]).map(k=>({"@type":ldType(ENTITIES[k].kind),"name":k}))}; } }
  else if(r.page==="tag"){ const e=ENTITIES[r.tag]; title=r.tag+" — kabar"; desc=e&&e.desc?e.desc:`Kumpulan berita dan informasi mengenai ${r.tag}.`;
    if(e&&e.kind==="orang") ld={"@context":"https://schema.org","@type":"Person","name":r.tag,"jobTitle":e.sub||"","description":e.desc,"url":url};
    else if(e&&e.kind==="lembaga") ld={"@context":"https://schema.org","@type":"Organization","name":r.tag,"description":e.desc,"url":url};
    else ld={"@context":"https://schema.org","@type":"CollectionPage","name":r.tag,"description":desc,"url":url}; }
  else if(r.page==="section"){ title=r.section+" — kabar"; desc=`Berita terbaru kanal ${r.section} di kabar.`; }
  else if(r.page==="author"){ const m=AUTHORS[r.author]; title=r.author+" — kabar"; desc=m?m.bio:`Artikel oleh ${r.author}.`; ld={"@context":"https://schema.org","@type":"Person","name":r.author,"jobTitle":(m&&m.role)||"Jurnalis","description":(m&&m.bio)||"","url":url}; }
  else if(r.page==="search"){ title=`Cari “${r.q}” — kabar`; desc=`Hasil pencarian untuk ${r.q}.`; }
  else if(r.page==="saved"){ title="Tersimpan — kabar"; }
  else if(r.page==="quiz"){ title="Kuis — kabar"; }
  else if(r.page==="index"){ title="Indeks Berita — kabar"; desc="Semua berita terbaru dari kabar."; }
  else if(r.page==="foto"){ title="Esai Foto — kabar"; desc="Liputan foto pilihan redaksi kabar."; }
  else if(r.page==="foto-essay"){ const e=PHOTO_ESSAYS.find(x=>x.id===r.id); if(e){ title=e.title+" — Esai Foto — kabar"; desc=e.desc; ogImage=e.cover; } }
  document.title=title;
  _headMeta("description",desc);
  _headMeta("og:title",title,"property"); _headMeta("og:description",desc,"property"); _headMeta("og:url",url,"property"); _headMeta("og:type",ogtype,"property"); _headMeta("og:site_name","kabar","property");
  _headMeta("og:image",ogImage,"property");
  _headCanon(url); _headLd(ld);
}

function updateParallax(){ if(REDUCE_MOTION) return; const vh=window.innerHeight||document.documentElement.clientHeight;
  document.querySelectorAll("[data-parallax]").forEach(layer=>{ const b=layer.parentElement.getBoundingClientRect();
    if(b.bottom<-vh||b.top>2*vh){ return; }
    // "paku" gambar ke viewport: gambar tampak diam, band-nya yang menggulung di atasnya (efek parallax)
    layer.style.transform=`translate3d(0, ${(-b.top).toFixed(1)}px, 0)`; }); }
// Pemicu FAQ: saat ujung body artikel masuk layar (bukan mentok seluruh halaman)
let faqObserver=null, faqDwell=null;
function setupFaqTrigger(id){
  if(faqObserver) faqObserver.disconnect();
  clearTimeout(faqDwell); faqDwell=null;
  const s=document.getElementById("read-end"); if(!s) return;
  // Muncul hanya bila ujung berita sudah tergulir ke bagian atas layar (dibaca)
  // DAN pembaca berhenti di situ ~1,2 detik — bukan sekadar baris terakhir nongol.
  faqObserver=new IntersectionObserver(es=>{ es.forEach(e=>{
    if(quizAutoShown) return;
    if(e.isIntersecting){ if(!faqDwell) faqDwell=setTimeout(()=>{ if(!quizAutoShown){ quizAutoShown=true; openFaqModal(id); faqObserver.disconnect(); } }, 1200); }
    else { clearTimeout(faqDwell); faqDwell=null; }
  }); }, { rootMargin: "0px 0px -45% 0px", threshold: 0 });
  faqObserver.observe(s);
}
